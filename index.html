
<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Privon Vault</title>
    
    <script>
      // Apply saved theme, accent and glass intensity immediately to prevent flash
      (function() {
        const root = document.documentElement;
        const saved = localStorage.getItem('app_theme_mode');
        let theme = saved === 'light' ? 'light' : 'dark';
        if (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme === 'dark');
        if (!saved) localStorage.setItem('app_theme_mode', 'dark');
        const light = theme === 'light';

        const savedAccent = localStorage.getItem('theme_accent') || localStorage.getItem('app_accent_manual') || '#E8E8E8';
        // Fit the accent to the theme so it stays readable as fill and as text
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(savedAccent.trim());
        let ar = 232, ag = 232, ab = 232;
        if (m) {
          ar = parseInt(m[1], 16); ag = parseInt(m[2], 16); ab = parseInt(m[3], 16);
          const cl = n => Math.max(0, Math.min(255, Math.round(n)));
          let lum = (0.299 * ar + 0.587 * ag + 0.114 * ab) / 255;
          if (theme === 'dark' && lum < 0.62) {
            const t = (0.62 - lum) / (1 - lum);
            ar = cl(ar + (255 - ar) * t); ag = cl(ag + (255 - ag) * t); ab = cl(ab + (255 - ab) * t);
          } else if (theme === 'light' && lum > 0.34) {
            const t = (lum - 0.34) / (1 - 0.34);
            ar = cl(ar * (1 - t)); ag = cl(ag * (1 - t)); ab = cl(ab * (1 - t));
          }
          lum = (0.299 * ar + 0.587 * ag + 0.114 * ab) / 255;
          root.style.setProperty('--accent-contrast', lum > 0.5 ? '#000000' : '#ffffff');
        } else {
          root.style.setProperty('--accent-contrast', theme === 'dark' ? '#000000' : '#ffffff');
        }
        const h2 = n => n.toString(16).padStart(2, '0');
        root.style.setProperty('--accent-color', `#${h2(ar)}${h2(ag)}${h2(ab)}`);
        root.style.setProperty('--accent-rgb', `${ar}, ${ag}, ${ab}`);

        const glassIntensity = parseInt(localStorage.getItem('app_glass_intensity') || '100') / 100;
        const gm = Math.max(0, Math.min(1, glassIntensity));
        const tint = light ? '0,0,0' : '255,255,255';
        const tintCard = light ? '255,255,255' : '255,255,255';
        root.style.setProperty('--glass-blur-light', `${12 * gm}px`);
        root.style.setProperty('--glass-blur-medium', `${20 * gm}px`);
        root.style.setProperty('--glass-blur-heavy', `${32 * gm}px`);
        root.style.setProperty('--glass-blur-xl', `${40 * gm}px`);
        root.style.setProperty('--glass-bg-ultra-light', `rgba(${tint},${(light ? 0.015 : 0.03) * gm})`);
        root.style.setProperty('--glass-bg-light', `rgba(${tint},${(light ? 0.03 : 0.06) * gm})`);
        root.style.setProperty('--glass-bg-medium', `rgba(${tint},${(light ? 0.05 : 0.1) * gm})`);
        root.style.setProperty('--glass-bg-heavy', `rgba(${tint},${(light ? 0.08 : 0.15) * gm})`);
        root.style.setProperty('--glass-border-subtle', `rgba(${tint},${(light ? 0.06 : 0.05) * gm})`);
        root.style.setProperty('--glass-border-light', `rgba(${tint},${(light ? 0.09 : 0.1) * gm})`);
        root.style.setProperty('--glass-border-medium', `rgba(${tint},${(light ? 0.12 : 0.15) * gm})`);
        root.style.setProperty('--glass-border-strong', `rgba(${tint},${(light ? 0.18 : 0.2) * gm})`);
        root.style.setProperty('--glass-accent-glow', `rgba(var(--accent-rgb),${0.15 * gm})`);
        root.style.setProperty('--glass-card-bg', light
          ? `linear-gradient(135deg, rgba(${tintCard},${0.95 * gm}) 0%, rgba(250,250,250,${0.9 * gm}) 100%)`
          : `linear-gradient(135deg, rgba(${tintCard},${0.12 * gm}) 0%, rgba(${tintCard},${0.03 * gm}) 100%)`);
        root.style.setProperty('--glass-card-border-top', `rgba(${tint},${(light ? 0.1 : 0.18) * gm})`);
        root.style.setProperty('--glass-card-border-left', `rgba(${tint},${(light ? 0.08 : 0.12) * gm})`);
        root.style.setProperty('--glass-card-border-bottom', `rgba(${tint},${(light ? 0.06 : 0.06) * gm})`);
        root.style.setProperty('--glass-card-border-right', `rgba(${tint},${(light ? 0.06 : 0.06) * gm})`);
        root.style.setProperty('--glass-modal-bg', light
          ? `linear-gradient(180deg, rgba(255,255,255,${0.98 * gm}) 0%, rgba(250,250,250,${0.99 * gm}) 100%)`
          : `linear-gradient(180deg, rgba(20,20,20,${0.85 * gm}) 0%, rgba(10,10,10,${0.95 * gm}) 100%)`);
        root.style.setProperty('--glass-modal-border-top', `rgba(${tint},${(light ? 0.1 : 0.12) * gm})`);
      })();
    </script>
    <style>
      html {
        background-color: var(--bg-main);
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        margin: 0;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        transition: background-color 0.5s ease, color 0.5s ease;
        font-family: var(--app-font);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-color);
      }
      
      :root {
        --accent-color: #E8E8E8;
        --accent-rgb: 232, 232, 232;
        --bg-main: #000000;
        --bg-card: #0a0a0a;
        --bg-surface: #141414;
        --border-color: #262626;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --app-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --onb-surface: rgba(255, 255, 255, 0.04);
        --onb-surface-strong: rgba(255, 255, 255, 0.07);
        --onb-border: rgba(255, 255, 255, 0.09);
        --onb-text-faint: rgba(255, 255, 255, 0.45);
      }
      [data-theme="light"] {
        --bg-main: #ffffff;
        --bg-card: #fafafa;
        --bg-surface: #f4f4f5;
        --border-color: #e5e5e5;
        --text-main: #0a0a0a;
        --text-muted: #6b7280;
        --onb-surface: rgba(0, 0, 0, 0.02);
        --onb-surface-strong: rgba(0, 0, 0, 0.04);
        --onb-border: rgba(0, 0, 0, 0.08);
        --onb-text-faint: rgba(0, 0, 0, 0.5);
      }
      
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 9999px;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
